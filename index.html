<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold'em</title>
<meta name="description" content="No-limit Texas hold'em against five bots. Six-max cash game, side pots, real hand evaluation, no dependencies.">
<meta name="theme-color" content="#F5F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1011" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F5F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hold'em">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<script>
  // theme before the first paint, so the page never flashes light
  (function(){try{var t=localStorage.getItem('hd.theme');t=t?JSON.parse(t):'auto';
    var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme',d?'dark':'light');
    document.documentElement.setAttribute('data-theme-mode',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <h1>Hold'em</h1>

  <div class="tools" id="tools">
    <div class="seg" role="radiogroup" aria-label="Theme" id="themeSeg">
      <div class="knob" id="themeKnob"></div>
      <button type="button" role="radio" data-mode="light" aria-checked="false" aria-label="Light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" role="radio" data-mode="auto" aria-checked="false" aria-label="Follow the system theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" role="radio" data-mode="dark" aria-checked="false" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>

    <button type="button" class="icon" id="btnSound" aria-pressed="true" aria-label="Sound on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6.5 9H3v6h3.5L11 19z"/>
        <path class="wave" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18.2 7a7 7 0 0 1 0 10"/>
        <path class="cross" d="M16 10l5 5M21 10l-5 5"/>
      </svg>
    </button>
    <button type="button" class="icon" id="btnStats" aria-label="Session statistics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
    </button>
    <button type="button" class="icon" id="btnSettings" aria-label="Table settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 12H2.1M21.9 12h-2.4M6.7 6.7 5 5M19 19l-1.7-1.7M6.7 17.3 5 19M19 5l-1.7 1.7"/></svg>
    </button>
    <button type="button" class="icon" id="btnHelp" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.5"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
    </button>
    <button type="button" class="icon menu-only" id="btnMenu" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <div class="bank">
    <span class="lbl">Your stack</span>
    <span class="val num" id="heroStack">1,000</span>
  </div>
</header>

<main class="felt" id="felt" aria-label="The table">
  <div class="rail" aria-hidden="true">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C9 6 4 9 4 13.5A4 4 0 0 0 11 16c-.2 1.8-1 3.2-2.5 4h7c-1.5-.8-2.3-2.2-2.5-4a4 4 0 0 0 7-2.5C20 9 15 6 12 2z"/></svg>
  </div>
  <div class="centre">
    <div class="pot" id="pot" aria-live="polite"><span class="chips" id="potChips" aria-hidden="true"></span><span class="lbl">Pot</span><span class="val num" id="potVal">0</span></div>
    <div class="board" id="board" aria-label="Community cards"></div>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <div class="seats" id="seats"></div>
  <div class="fly" id="fly" aria-hidden="true"></div>
</main>

<footer class="controls" id="controls">
  <div class="sizer" id="sizer" hidden>
    <div class="presets" id="presets" role="group" aria-label="Bet size">
      <button type="button" class="pill" data-preset="min">Min</button>
      <button type="button" class="pill" data-preset="half">½ pot</button>
      <button type="button" class="pill" data-preset="three">¾ pot</button>
      <button type="button" class="pill" data-preset="pot">Pot</button>
      <button type="button" class="pill" data-preset="max">All-in</button>
    </div>
    <div class="slide">
      <input type="range" id="slider" min="0" max="100" value="0" step="1" aria-label="Bet size">
      <output class="amt num" id="sizeVal" for="slider">0</output>
    </div>
  </div>

  <div class="row acts" id="acts" hidden>
    <button type="button" class="btn" id="btnFold">Fold <kbd>1</kbd></button>
    <button type="button" class="btn" id="btnCall">Check <kbd>2</kbd></button>
    <button type="button" class="btn" id="btnRaise">Raise <kbd>3</kbd></button>
  </div>

  <div class="row" id="uiNext" hidden>
    <button type="button" class="btn primary" id="btnNext">Next hand <kbd>Space</kbd></button>
  </div>
  <div class="row" id="uiRebuy" hidden>
    <button type="button" class="btn primary" id="btnRebuy">Buy in again</button>
  </div>
  <div class="row" id="uiWait" hidden>
    <span class="waiting" id="waiting">Dealing…</span>
  </div>

  <p class="hint" id="hint">No-limit hold'em · blinds 5/10 · buy-in 1,000</p>
</footer>

<div class="toast" id="toast" role="status"></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle">How to play</h2>
    <button type="button" class="icon" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody" tabindex="0"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
